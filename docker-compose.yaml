name: dcc-sms-gateway

# Shared by the gateway API and worker. The carrier gets its own settings later.
x-gateway-env: &gateway-env
  DATABASE_URL: postgresql+asyncpg://sms:sms@postgres:5432/sms
  REDIS_URL: redis://redis:6379/0
  CARRIER_URL: http://carrier:8001
  DLR_SECRET: dev-dlr-secret
  ADMIN_API_KEY: dev-admin-key
  CARRIER_SUBMIT_RATE: "20"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: ./gateway
    environment: *gateway-env
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/app:/app/app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./gateway
    environment: *gateway-env
    volumes:
      - ./gateway/app:/app/app
    command:
      [
        "watchfiles",
        "--filter",
        "python",
        "--ignore-paths",
        "__pycache__",
        "python -m app.worker.worker",
        "app",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  carrier:
    build: ./carrier
    environment:
      GATEWAY_URL: http://api:8000
      DLR_SECRET: dev-dlr-secret
    ports:
      - "8001:8001"
    volumes:
      - ./carrier/app:/app/app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]

volumes:
  pgdata:
