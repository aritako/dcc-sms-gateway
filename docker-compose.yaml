name: dcc-sms-gateway

# Shared by the gateway API, workers and the migrate/seed one-shots. The
# carrier gets its own settings below; DLR_SECRET must match on both sides.
x-gateway-env: &gateway-env
  DATABASE_URL: postgresql+asyncpg://sms:sms@postgres:5432/sms
  REDIS_URL: redis://redis:6379/0
  CARRIER_URL: http://carrier:8001
  DLR_SECRET: ${DLR_SECRET:-dev-dlr-secret}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
  CARRIER_SUBMIT_RATE: "45"

# One image, shared by every gateway service. Scoping the tag to the compose
# project keeps an isolated `-p` check from overwriting another project's image.
x-gateway-service: &gateway-service
  build: ./gateway
  image: ${COMPOSE_PROJECT_NAME:-dcc-sms-gateway}-gateway
  environment: *gateway-env

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms"]
      interval: 2s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    <<: *gateway-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *gateway-service
    command: ["python", "-m", "app.seed"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    <<: *gateway-service
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./gateway/app:/app/app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  worker:
    <<: *gateway-service
    deploy:
      replicas: 3
    volumes:
      - ./gateway/app:/app/app
    command:
      [
        "watchfiles",
        "--filter",
        "python",
        "--ignore-paths",
        "__pycache__",
        "python -m app.worker.worker",
        "app",
      ]
    # watchfiles keeps the container alive across worker restarts, so check
    # for the worker process itself and not just the container's PID 1.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import glob, sys; sys.exit(0 if any(b'app.worker.worker' in c and b'watchfiles' not in c for c in (open(p, 'rb').read() for p in glob.glob('/proc/[0-9]*/cmdline'))) else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  carrier:
    build: ./carrier
    environment:
      GATEWAY_URL: http://api:8000
      DLR_SECRET: ${DLR_SECRET:-dev-dlr-secret}
    ports:
      - "${CARRIER_PORT:-8001}:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - ./carrier/app:/app/app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]

volumes:
  pgdata:
